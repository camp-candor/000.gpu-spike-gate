# ─────────────────────────────────────────────────────────────
# WORKFLOW: Main CI
#
# Runs on every push into `main` and verifies the build and tests.
# ─────────────────────────────────────────────────────────────
name: Main CI

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: push-main-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    HUSKY: 0

jobs:
    ci:
        name: build & test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test --if-present
