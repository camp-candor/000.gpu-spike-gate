name: Build and Push GHCR Container

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gpu-spike-gate-00:v1

      - name: Ensure Package Visibility is Public
        env:
          # Use GHCR_PAT if stored in repo secrets, fallback to GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Setting package visibility to public..."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /orgs/${{ github.repository_owner }}/packages/container/gpu-spike-gate-00/visibility \
            -f visibility=public || echo "Failed via org endpoint, attempting user endpoint..."

          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/gpu-spike-gate-00/visibility \
            -f visibility=public || true
